# Civilizations runtime configuration.
storage:
  # The historical filename is retained so existing development databases keep loading.
  database-file: civilizations-v2.db
claims:
  # Inclusive X/Z block area of one rectangular claim.
  max-area: 65536
  max-count: 32
  # Additional rectangles must share a non-zero block edge with existing land.
  require-edge-connection: true
gameplay:
  # Phase gates may disable behavior in any listed phase. Unsafe phases cannot
  # be added: claim changes during war and all archived-state mutation remain
  # application invariants rather than configuration switches. Active battle
  # participant/side snapshots do not change when the political roster changes.
  phase-gates:
    roster-changes:
      - SETUP
      - PEACE
      - WAR
    claim-creation:
      - SETUP
      - PEACE
    member-land-actions:
      - SETUP
      - PEACE
      - WAR
  war:
    # Snapshotted into each declaration; changes affect future wars after restart.
    battle-duration-seconds: 1800
